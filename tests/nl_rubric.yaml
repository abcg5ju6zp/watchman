rubrics:
  - id: 1
    type: f2p
    text: "向量重建固定模型、维度以及实体 ID 和名称顺序，输入变化不会混入正在构建的候选。"
  - id: 2
    type: f2p
    text: "缓存命中必须验证模型配置、内容身份和向量维度，不匹配的旧缓存条目不会被复用。"
  - id: 3
    type: f2p
    text: "provider 某个批次失败时活动 index 不变，已确认批次可供同一重建恢复而不伪装完成。"
  - id: 4
    type: f2p
    text: "内存或 SQL 缓存写入失败会阻止对应向量被计入完成进度，错误不会被静默吞掉。"
  - id: 5
    type: f2p
    text: "候选 index 只有在向量数量、维度和实体映射全部核验后才替换活动 index。"
  - id: 6
    type: f2p
    text: "名单代际或模型配置变化会废弃旧候选，较晚完成的旧重建不能覆盖新代际。"
  - id: 7
    type: f2p
    text: "服务重启从已确认缓存和重建进度继续，查询始终只访问一个活动代际。"
  - id: 8
    type: p2p
    text: "未启用 embeddings、两类缓存和正常向量搜索保持兼容。"
