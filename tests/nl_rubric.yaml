rubrics:
  - id: 1
    type: f2p
    text: "刷新开始固定启用源集合和数据代际，下载期间的配置变化不会混入本轮。"
  - id: 2
    type: f2p
    text: "必需源失败时在线文本和向量搜索仍完整使用上一代，刷新状态准确报告失败。"
  - id: 3
    type: f2p
    text: "允许失败源可明确沿用上一代该源数据，其统计和搜索结果不会伪装成已更新。"
  - id: 4
    type: f2p
    text: "文本 corpus、TFIDF 和向量索引只会共同切换到由同一实体清单构建的新代际。"
  - id: 5
    type: f2p
    text: "向量 provider、缓存或索引构建失败时不发布已完成的文本候选。"
  - id: 6
    type: f2p
    text: "发布阶段进程退出后，启动会完成或废弃同一候选，不会重新下载后混合代际。"
  - id: 7
    type: f2p
    text: "同步和异步刷新共享发布仲裁，重复异步触发不会产生并行候选或覆盖较新结果。"
  - id: 8
    type: p2p
    text: "未启用 embeddings、正常刷新和既有允许失败源行为保持兼容。"
