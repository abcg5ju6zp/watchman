rubrics:
  - id: 1
    type: f2p
    text: "每次上传使用稳定文件版本，重复提交同一内容不会创建新的可见版本或重复实体。"
  - id: 2
    type: f2p
    text: "文件解析、schema 校验或实体合并失败时，数据库和搜索仍完整使用旧文件版本。"
  - id: 3
    type: f2p
    text: "数据库替换以来源为边界提交，任何中途失败都不会留下新旧来源行混合或错误校验摘要。"
  - id: 4
    type: f2p
    text: "数据库版本与校验摘要提交后，内存 corpus 和 TFIDF 只从该版本构建并条件发布。"
  - id: 5
    type: f2p
    text: "数据库已提交而内存刷新失败时接口不会宣告成功，重试只继续发布阶段而不重复替换数据。"
  - id: 6
    type: f2p
    text: "服务重启能从数据库识别待发布版本并恢复在线搜索，不依赖再次上传文件。"
  - id: 7
    type: f2p
    text: "连续上传同一来源时按版本仲裁，较旧解析或刷新结果不能覆盖较新成功版本。"
  - id: 8
    type: p2p
    text: "未知 schema、空结果拒绝、其他来源和正常摄取搜索保持兼容。"
